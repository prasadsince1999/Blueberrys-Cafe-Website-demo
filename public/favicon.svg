    <path d="M-18,-8 L18,-8 C18,12 -18,12 -18,-8 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
    <path d="M-4,-14 C-8,-18 -1,-24 -5,-30" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <path d="M5,-12 C10,-18 3,-25 8,-32" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
  </g>
