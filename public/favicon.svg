  </defs>

  <!-- Outer border -->
  <circle cx="140" cy="140" r="96" fill="#0012B5" />
  <circle cx="140" cy="140" r="90" fill="#FFFFFF" />
  <circle cx="140" cy="140" r="86" fill="#0076F5" />

  <!-- Stripes -->
  <g clip-path="url(#circle-clip)">
    <rect x="0" y="140" width="280" height="140" fill="#FFFFFF" />
    <rect x="55" y="140" width="10" height="140" fill="#0076F5" />
    <rect x="75" y="140" width="10" height="140" fill="#0076F5" />
    <rect x="95" y="140" width="10" height="140" fill="#0076F5" />
    <rect x="115" y="140" width="10" height="140" fill="#0076F5" />
    <rect x="135" y="140" width="10" height="140" fill="#0076F5" />
    <rect x="155" y="140" width="10" height="140" fill="#0076F5" />
    <rect x="175" y="140" width="10" height="140" fill="#0076F5" />
    <rect x="195" y="140" width="10" height="140" fill="#0076F5" />
    <rect x="215" y="140" width="10" height="140" fill="#0076F5" />
  </g>

  <!-- Horizontal banner -->
  <rect x="10" y="117" width="260" height="46" rx="8" fill="#0012B5" />
